<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Voleyball</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* Voleyball — estética de Clashball (noche, colores de equipo vivos) con amarillo de pelota de vóley como color de acción. */
:root {
  --ink: #0a0f1c;
  --ink2: #111831;
  --panel: rgba(12, 18, 34, 0.9);
  --line: rgba(255, 255, 255, 0.09);
  --line2: rgba(255, 255, 255, 0.16);
  --text: #eef2ff;
  --mute: #8b97b9;
  --acc: #ffd23f;
  --acc-d: #e6b400;
  --red: #ff4b5c;
  --blue: #3d8bff;
  --gold: #ffd166;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --display: 'Russo One', 'Rubik', system-ui, sans-serif;
  --ui: 'Rubik', system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: var(--text);
  font: 500 15px/1.35 var(--ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
button,
input {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
}
button {
  cursor: pointer;
}
[hidden] {
  display: none !important;
}
svg {
  display: block;
}
canvas#cv {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.shade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 30% 40%, rgba(10, 15, 28, 0.55), rgba(10, 15, 28, 0.9) 70%);
  opacity: 0;
  transition: opacity 0.5s var(--ease);
}
.shade.on {
  opacity: 1;
}

/* ---------------- pantallas ---------------- */
.screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: calc(56px + var(--safe-t)) calc(14px + var(--safe-r)) calc(16px + var(--safe-b)) calc(14px + var(--safe-l));
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 0.35s var(--ease),
    visibility 0s linear 0.35s;
  -webkit-user-select: none;
  user-select: none;
}
.screen.on {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.35s var(--ease);
}
.panel {
  width: min(520px, 100%);
  padding: 22px;
  border-radius: 22px;
  background: var(--panel);
  border: 1px solid var(--line2);
  box-shadow:
    0 30px 80px -30px rgba(0, 0, 0, 0.8),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  display: grid;
  gap: 14px;
  transform: translateY(14px) scale(0.985);
  transition: transform 0.5s var(--spring);
}
.screen.on .panel {
  transform: none;
}
.panel.narrow {
  width: min(400px, 100%);
}
.panel.wide {
  width: min(860px, 100%);
}
.panel.center {
  text-align: center;
}
.panel h2 {
  font: 400 22px/1.1 var(--display);
  letter-spacing: 0.02em;
}
.phead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.grow {
  flex: 1;
}
.back {
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 12px;
  border: 1px solid var(--line2);
  display: grid;
  place-items: center;
  transition:
    border-color 0.2s,
    transform 0.3s var(--spring);
}
.back:hover {
  border-color: var(--acc);
  transform: translateX(-2px);
}
.back svg,
.btn svg,
.hud-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lbl {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mute);
}
.lbl.center {
  text-align: center;
  margin-top: -8px;
}
.note {
  font-size: 12px;
  color: var(--mute);
  align-self: center;
}
.status {
  min-height: 1.3em;
  font-size: 14px;
  color: var(--gold);
}
.keys {
  font-size: 12.5px;
  color: var(--mute);
  line-height: 1.7;
  text-align: center;
}
kbd {
  display: inline-block;
  min-width: 20px;
  padding: 1px 6px;
  border-radius: 6px;
  border: 1px solid var(--line2);
  border-bottom-width: 2px;
  font: 600 11px/1.4 var(--ui);
  color: var(--text);
  text-align: center;
}

/* ---------------- botones y campos ---------------- */
.btn {
  height: 44px;
  padding: 0 18px;
  border-radius: 13px;
  background: var(--acc);
  color: #1f1600;
  font-weight: 800;
  letter-spacing: 0.04em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  box-shadow: 0 10px 30px -12px var(--acc);
  transition:
    transform 0.3s var(--spring),
    background 0.2s,
    box-shadow 0.2s,
    opacity 0.2s;
}
.btn:hover {
  transform: translateY(-2px);
  background: #ffe07a;
}
.btn:active {
  transform: scale(0.97);
}
.btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}
.btn.big {
  height: 54px;
  font: 400 19px/1 var(--display);
  letter-spacing: 0.08em;
}
.btn.ghost {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  border: 1px solid var(--line2);
  box-shadow: none;
}
.btn.ghost:hover {
  border-color: var(--acc);
  color: var(--acc);
  background: rgba(255, 210, 63, 0.06);
}
.link {
  color: var(--mute);
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 0.2s;
}
.link:hover {
  color: var(--acc);
}
.field {
  height: 46px;
  width: 100%;
  min-width: 0;
  padding: 0 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line2);
  font-size: 16px;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition:
    border-color 0.2s,
    background 0.2s;
}
.field:focus {
  border-color: var(--acc);
  background: rgba(255, 210, 63, 0.05);
}
.field.code {
  text-transform: uppercase;
  letter-spacing: 0.3em;
  text-align: center;
  font-family: var(--display);
  width: 150px;
}
.field.av {
  width: 74px;
  text-align: center;
  font-weight: 800;
  font-size: 20px;
}
.row {
  display: flex;
  gap: 12px;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.actions .btn {
  flex: 1;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
}
.check input {
  appearance: none;
  width: 38px;
  height: 22px;
  border-radius: 99px;
  border: 1px solid var(--line2);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
}
.check input::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--mute);
  transition:
    transform 0.3s var(--spring),
    background 0.2s;
}
.check input:checked {
  background: var(--acc);
  border-color: var(--acc);
}
.check input:checked::after {
  transform: translateX(16px);
  background: var(--ink);
}
.check input:disabled {
  opacity: 0.5;
}

/* control segmentado */
.seg {
  display: flex;
  gap: 6px;
}
.seg.wrap {
  flex-wrap: wrap;
}
.seg button {
  flex: 1 1 auto;
  min-width: 44px;
  height: 38px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--line2);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  color: var(--mute);
  transition:
    color 0.2s,
    border-color 0.2s,
    background 0.2s,
    transform 0.3s var(--spring);
}
.seg.wrap button {
  flex: 0 1 auto;
}
.seg button:hover {
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.35);
}
.seg button.on {
  color: #1f1600;
  background: var(--acc);
  border-color: var(--acc);
}
.seg.ro button {
  pointer-events: none;
}
.seg.ro button:not(.on) {
  opacity: 0.45;
}

/* ---------------- inicio ---------------- */
.home {
  width: min(980px, 100%);
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  align-items: center;
  gap: 30px 40px;
}
.logo {
  font: 400 clamp(52px, 9vw, 104px) / 0.86 var(--display);
  letter-spacing: 0.01em;
  display: grid;
  transform: skewX(-7deg);
}
.logo span {
  display: block;
  text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
  animation: logoIn 0.9s var(--spring) both;
}
.logo .b {
  color: var(--acc);
  animation-delay: 0.08s;
}
.logo .ball {
  display: inline-block;
  width: 0.62em;
  height: 0.62em;
  margin: 0 0.04em;
  border-radius: 50%;
  vertical-align: 0.02em;
  background:
    radial-gradient(circle at 120% 50%, transparent 52%, #2f6fe0 53%, #2f6fe0 62%, transparent 63%),
    radial-gradient(circle at -20% 50%, transparent 52%, #ffd23f 53%, #ffd23f 62%, transparent 63%),
    radial-gradient(circle at 35% 30%, #fff, #e3e8f2 60%, #c3cbe0);
  border: 0.07em solid var(--ink);
  box-shadow: 0 0 0 0.03em var(--acc);
  animation: roll 3.2s var(--ease) infinite;
}
@keyframes logoIn {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
}
@keyframes roll {
  0%,
  70% {
    transform: none;
  }
  85% {
    transform: translateY(-0.12em) rotate(160deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
.tagline {
  margin-top: 16px;
  color: var(--mute);
  font-size: 17px;
  max-width: 420px;
}
.menu {
  display: grid;
  gap: 10px;
}
.item {
  position: relative;
  display: grid;
  grid-template-columns: 38px 1fr;
  grid-template-rows: auto auto;
  column-gap: 12px;
  align-items: center;
  text-align: left;
  padding: 14px 18px;
  border-radius: 18px;
  background: var(--panel);
  border: 1px solid var(--line2);
  overflow: hidden;
  animation: itemIn 0.7s var(--spring) both;
  transition:
    transform 0.35s var(--spring),
    border-color 0.2s,
    box-shadow 0.2s;
}
.item:nth-child(2) {
  animation-delay: 0.06s;
}
.item:nth-child(3) {
  animation-delay: 0.12s;
}
.item:nth-child(4) {
  animation-delay: 0.18s;
}
@keyframes itemIn {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
}
.item em {
  grid-row: 1 / 3;
  font: 400 20px/1 var(--display);
  color: var(--acc);
  font-style: normal;
  opacity: 0.9;
}
.item b {
  font: 400 21px/1.1 var(--display);
  letter-spacing: 0.03em;
}
.item small {
  color: var(--mute);
  font-size: 13.5px;
}
.item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 210, 63, 0.1) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 0.6s var(--ease);
}
.item:hover,
.item:focus-visible {
  transform: translateX(-6px);
  border-color: var(--acc);
  box-shadow: 0 0 0 1px var(--acc), 0 14px 40px -18px var(--acc);
  outline: none;
}
.item:hover::after {
  transform: translateX(100%);
}
.item.ghost {
  background: rgba(12, 18, 34, 0.6);
}
.me-chip {
  grid-column: 1 / -1;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  border-radius: 99px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 14px;
}
.me-chip i,
.me-mini i,
.pl i {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 700 12px/1 var(--ui);
  font-style: normal;
  background: var(--red);
  border: 2px solid var(--ink);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
}
.me-mini {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 4px;
  border-radius: 99px;
  border: 1px solid var(--line2);
  font-size: 14px;
}
@media (max-width: 760px) {
  .home {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .brand {
    text-align: center;
  }
  .logo {
    justify-items: center;
  }
  .tagline {
    margin: 10px auto 0;
    font-size: 15px;
  }
  .me-chip {
    justify-self: center;
  }
  .item {
    padding: 11px 14px;
  }
  .item b {
    font-size: 18px;
  }
}
@media (orientation: landscape) and (max-height: 520px) {
  .home {
    grid-template-columns: 1fr 1.1fr;
    gap: 12px 24px;
  }
  .logo {
    font-size: 56px;
  }
  .tagline {
    font-size: 14px;
  }
  .item {
    padding: 8px 14px;
  }
  .item small {
    display: none;
  }
  .screen {
    padding-top: calc(12px + var(--safe-t));
  }
}

/* ---------------- configurar ---------------- */
.opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
}
.opt {
  display: grid;
  gap: 8px;
  align-content: start;
}
.opt.full {
  grid-column: 1 / -1;
}
.modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mode {
  display: grid;
  gap: 4px;
  text-align: left;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--line2);
  transition:
    border-color 0.2s,
    background 0.2s,
    transform 0.3s var(--spring);
}
.mode svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: var(--acc);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mode b {
  font: 400 15px/1.1 var(--display);
  letter-spacing: 0.03em;
}
.mode small {
  color: var(--mute);
  font-size: 12px;
  line-height: 1.3;
}
.mode:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.35);
}
.mode.on {
  border-color: var(--acc);
  background: rgba(255, 210, 63, 0.08);
  box-shadow: inset 0 0 0 1px var(--acc);
}
@media (max-width: 700px) {
  .opts {
    grid-template-columns: 1fr;
  }
  .modes {
    grid-template-columns: 1fr 1fr;
  }
}

/* ---------------- online ---------------- */
.on-top {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.join {
  display: flex;
  gap: 8px;
  margin-left: auto;
}
.create {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 12px;
  border-radius: 14px;
  border: 1px dashed var(--line2);
  animation: drop 0.4s var(--ease);
}
.create .field {
  flex: 1;
  min-width: 180px;
}
@keyframes drop {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
}
.rooms-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rooms {
  list-style: none;
  display: grid;
  gap: 6px;
  max-height: min(46vh, 380px);
  overflow-y: auto;
  padding-right: 2px;
}
.rooms li {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  cursor: pointer;
  transition:
    border-color 0.2s,
    background 0.2s,
    transform 0.3s var(--spring);
  animation: drop 0.35s var(--ease) both;
}
.rooms li:hover {
  border-color: var(--acc);
  background: rgba(255, 210, 63, 0.05);
  transform: translateX(3px);
}
.rooms li.full {
  opacity: 0.5;
  pointer-events: none;
}
.rooms b {
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rooms small {
  color: var(--mute);
  font-size: 12.5px;
  white-space: nowrap;
}
.rooms .n {
  font: 400 15px/1 var(--display);
}
.pill {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 99px;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.08);
  color: var(--mute);
}
.pill.live {
  background: rgba(255, 75, 92, 0.18);
  color: #ff8a95;
}
.rooms .empty {
  display: block;
  text-align: center;
  color: var(--mute);
  cursor: default;
  font-size: 14px;
}
.rooms .empty:hover {
  transform: none;
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.035);
}
@media (max-width: 620px) {
  .join {
    margin-left: 0;
    width: 100%;
  }
  .join .field {
    flex: 1;
  }
  .on-top .btn {
    flex: 1;
  }
  .rooms li {
    grid-template-columns: 1fr auto;
  }
  .rooms li .pill,
  .rooms li small:last-of-type {
    display: none;
  }
}

/* ---------------- sala ---------------- */
.panel.room {
  width: min(1040px, 100%);
}
.rtitle {
  display: grid;
  min-width: 0;
}
.rtitle h2 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rtitle small {
  color: var(--mute);
  font-size: 13px;
}
.code-chip {
  font: 400 18px/1 var(--display);
  letter-spacing: 0.2em;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px dashed var(--acc);
  color: var(--acc);
  transition: background 0.2s;
}
.code-chip:hover {
  background: rgba(255, 210, 63, 0.08);
}
.room-body {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  grid-template-areas: 'teams chat' 'set chat';
  gap: 14px;
}
.teams {
  grid-area: teams;
  display: grid;
  grid-template-columns: 1fr 0.85fr 1fr;
  gap: 8px;
}
.tcol {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 190px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
  overflow: hidden;
}
.tcol header {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 8px;
  justify-content: space-between;
  align-items: center;
  padding: 9px 12px;
  font: 400 14px/1 var(--display);
  letter-spacing: 0.06em;
}
.tcol.red header {
  background: linear-gradient(90deg, rgba(255, 75, 92, 0.3), transparent);
  color: #ff9aa4;
}
.tcol.blue header {
  background: linear-gradient(90deg, rgba(61, 139, 255, 0.3), transparent);
  color: #9cc3ff;
}
.tcol.spec header {
  color: var(--mute);
  font-size: 12px;
}
.tcol header .link {
  font: 500 12px/1 var(--ui);
}
.tcol ul {
  list-style: none;
  padding: 6px;
  display: grid;
  gap: 4px;
  align-content: start;
}
.tcol.drop {
  border-color: var(--acc);
  background: rgba(255, 210, 63, 0.05);
}
.pl {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 10px;
  font-size: 14px;
  background: rgba(255, 255, 255, 0.04);
  animation: drop 0.3s var(--ease) both;
}
.pl i {
  width: 24px;
  height: 24px;
  font-size: 11px;
}
.pl.me {
  box-shadow: inset 0 0 0 1px rgba(255, 210, 63, 0.6);

}

}

}
.checks {

  gap: 18px;
  flex-wrap: wrap;
}
.rchat {
  grid-area: chat;
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 8px;
  min-height: 0;

.rchat .field {

}
.msg b {
  font-weight: 700;
}
.msg.sys {

}
.msg .t1 {

}
.msg .t2 {

}
.msg .t0 {

}
.room-foot {

}

/* ---------------- resultados ---------------- */
.panel.results {

  animation: pop 0.7s var(--spring) both;
}
.res-title.t1 {
  color: var(--red);
  text-shadow: 0 0 30px rgba(255, 75, 92, 0.5);
}
.res-title.t2 {
  color: var(--blue);
  text-shadow: 0 0 30px rgba(61, 139, 255, 0.5);
}

    transform: scale(0.6);

}

  align-items: center;

}
.res-score .r {
  color: var(--red);
}
.res-score .b {
  color: var(--blue);
}
.res-score i {
  font-style: normal;

}
.poss {

}
.poss .bar {

.stats {

.stats th {

.stats td:first-child {

  align-items: center;
  gap: 8px;
}
.stats td:first-child i {
  width: 10px;
  height: 10px;
  border-radius: 50%;

}
.stats tr.mvp td:first-child::after {
  content: 'MVP';
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  border-radius: 99px;
  background: var(--gold);
  color: var(--ink);
}
.stats tr.mine td {
  color: var(--acc);
}

.srv {

}
.touches {
  position: absolute;

  transform: translateX(-50%);

  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  background: rgba(10, 15, 28, 0.72);
  border: 1px solid var(--line2);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.25s;
}
.touches.on {
  opacity: 1;
}
.touches span {
  margin-right: 3px;
}
.touches i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
}
.touches.t1 span {
  color: #ff8a95;
}
.touches.t2 span {
  color: #8dbaff;
}
.touches.t1 i.on {
  background: var(--red);
  border-color: var(--red);
}
.touches.t2 i.on {
  background: var(--blue);
  border-color: var(--blue);
}

}

  .touches {
    top: calc(52px + var(--safe-t));
  }
}
.vs {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 4px 12px;
  font-size: 13px;
  align-items: center;
}
.vs b {
  font: 400 16px/1 var(--display);
  font-variant-numeric: tabular-nums;
}
.vs b.l {
  text-align: right;
  color: var(--red);
}
.vs b.r {
  text-align: left;
  color: var(--blue);
}
.vs small {
  color: var(--mute);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
}
.vs .long {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--gold);
  font-size: 13px;
  margin-top: 2px;
}

/* ---------------- ayuda ---------------- */
.help-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}
.help-grid section {
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
  display: grid;
  gap: 8px;
  align-content: start;
}
.help-grid section:last-child {
  grid-column: 1 / -1;
}
.help-grid h3 {
  font: 400 15px/1.1 var(--display);
  color: var(--acc);
  letter-spacing: 0.04em;
}
.help-grid p {
  font-size: 14px;
  color: #cfd6ea;
  line-height: 1.55;
}

/* ---------------- HUD ---------------- */
.hud {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}
.board {
  position: absolute;
  top: calc(10px + var(--safe-t));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  border-radius: 14px;
  overflow: hidden;
  background: rgba(10, 15, 28, 0.82);
  border: 1px solid var(--line2);
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.8);
}
.side {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
}
.side b {
  font: 400 26px/1 var(--display);
  min-width: 22px;
  text-align: center;
}
.side .tag {
  font: 400 11px/1 var(--display);
  letter-spacing: 0.1em;
  padding: 5px 7px;
  border-radius: 7px;
}
.side.red .tag {
  background: var(--red);
}
.side.blue .tag {
  background: var(--blue);
}
.side b.bump {
  animation: bump 0.6s var(--spring);
}
@keyframes bump {
  40% {
    transform: scale(1.6);
    color: var(--acc);
  }
}
.clock {
  display: grid;
  place-items: center;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.05);
  min-width: 86px;
}
.clock b {
  font: 400 20px/1 var(--display);
  font-variant-numeric: tabular-nums;
}
.clock small {
  white-space: nowrap;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--gold);
  text-transform: uppercase;
  min-height: 1.1em;
}
.hud-right {
  position: absolute;
  top: calc(12px + var(--safe-t));
  right: calc(12px + var(--safe-r));
  display: flex;
  gap: 8px;
  align-items: center;
  pointer-events: auto;
}
/* dentro del portal, arriba a la derecha está su botón de preferencias */
body.embedded .hud-right {
  top: calc(54px + var(--safe-t));
}
/* pantallas angostas: los botones van debajo del marcador */
@media (max-width: 480px) {
  .hud-right,
  body.embedded .hud-right {
    top: calc(64px + var(--safe-t));
  }
}
.hud-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: rgba(10, 15, 28, 0.7);
  border: 1px solid var(--line2);
  transition: border-color 0.2s;
}
.hud-btn:hover {
  border-color: var(--acc);
}
.ping {
  font-size: 11px;
  font-weight: 700;
  color: var(--mute);
  padding: 4px 8px;
  border-radius: 8px;
  background: rgba(10, 15, 28, 0.6);
}
.ping.bad {
  color: var(--gold);
}
.hint {
  position: absolute;
  bottom: calc(14px + var(--safe-b));
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: min(92vw, 720px);
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.75);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  transition: opacity 0.6s;
}
.hint.off {
  opacity: 0;
}
.banner {
  position: absolute;
  top: 34%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
}
.banner b {
  font: 400 clamp(46px, 10vw, 110px) / 0.9 var(--display);
  letter-spacing: 0.02em;
  font-style: italic;
  text-shadow: 0 8px 0 rgba(0, 0, 0, 0.35);
}
.banner small {
  font-size: clamp(14px, 2.4vw, 20px);
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 99px;
  background: rgba(10, 15, 28, 0.75);
}
.banner.show {
  animation: banner 2.4s var(--ease) both;
}
.banner.t1 b {
  color: var(--red);
}
.banner.t2 b {
  color: var(--blue);
}
.banner.t0 b {
  color: var(--acc);
}
@keyframes banner {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4) rotate(-6deg);
  }
  14% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.08) rotate(0);
  }
  22%,
  82% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -60%) scale(0.96);
  }
}
@media (max-width: 640px), (orientation: landscape) and (max-height: 520px) {
  .board {
    top: calc(8px + var(--safe-t));
  }
  .side b {
    font-size: 21px;
  }
  .clock {
    min-width: 70px;
    padding: 4px 10px;
  }
  .clock b {
    font-size: 16px;
  }
}

/* ---------------- chat ---------------- */
.chat {
  position: fixed;
  z-index: 6;
  left: calc(12px + var(--safe-l));
  bottom: calc(12px + var(--safe-b));
  width: min(380px, calc(100vw - 24px));
  display: grid;
  gap: 6px;
  pointer-events: none;
}
.chat ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 13.5px;
}
.chat li {
  align-self: flex-start;
  max-width: 100%;
  padding: 3px 9px;
  border-radius: 8px;
  background: rgba(10, 15, 28, 0.62);
  overflow-wrap: anywhere;
  transition: opacity 0.8s;
}
.chat li.old {
  opacity: 0;
}
.chat.typing li.old {
  opacity: 1;
}
.chat form {
  display: none;
  pointer-events: auto;
}
.chat.typing form {
  display: block;
}
.chat input {
  width: 100%;
  height: 38px;
  padding: 0 12px;
  border-radius: 10px;
  background: rgba(10, 15, 28, 0.9);
  border: 1px solid var(--acc);
  outline: none;
  font-size: 15px;
  -webkit-user-select: text;
  user-select: text;
}
body.is-touch .hint {
  bottom: calc(160px + var(--safe-b));
}
body.is-touch .chat {
  bottom: calc(150px + var(--safe-b));
}

/* ---------------- táctil ---------------- */
.touch {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

  position: absolute;
  left: 0;
  bottom: 0;
  width: 55%;
  height: 70%;
  pointer-events: auto;
  touch-action: none;
}
.stick {
  position: absolute;
  left: calc(34px + var(--safe-l));

  height: 124px;

  position: absolute;

  top: 50%;

  background: rgba(255, 255, 255, 0.28);
  border: 2px solid rgba(255, 255, 255, 0.5);
}
.stick.on {
  border-color: rgba(255, 210, 63, 0.6);
}
.hit-btn {
  position: absolute;
  right: calc(30px + var(--safe-r));
  bottom: calc(36px + var(--safe-b));
  width: 104px;
  height: 104px;
  border-radius: 50%;
  pointer-events: auto;
  touch-action: none;
  background: rgba(255, 210, 63, 0.16);
  border: 2px solid rgba(255, 210, 63, 0.7);
  color: var(--acc);
  font: 400 14px/1 var(--display);
  letter-spacing: 0.06em;
  transition:
    transform 0.08s,
    background 0.08s;
}
.hit-btn.on {
  transform: scale(0.92);
  background: rgba(255, 210, 63, 0.42);
  color: var(--ink);
}

/* ---------------- toast ---------------- */
.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  transform: translate(-50%, 20px);
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(10, 15, 28, 0.95);
  border: 1px solid var(--acc);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.3s,
    transform 0.4s var(--spring);
}

  opacity: 1;
  transform: translate(-50%, 0);
}

    prefs = p;
    applyTheme();
    updateFps();
    subs.prefs.forEach(function (fn) { fn(prefs); });
  }

  // ---------- contador de FPS (preferencia global "Mostrar FPS") ----------
  var frames = 0, lastT = 0, rafId = 0;
  function fpsLoop(t) {
    frames++;
    if (!lastT) lastT = t;
    if (t - lastT >= 500) {
      if (fpsEl) fpsEl.textContent = Math.round((frames * 1000) / (t - lastT)) + ' fps';
      frames = 0;
      lastT = t;
    }
    rafId = requestAnimationFrame(fpsLoop);
  }
  function updateFps() {
    if (prefs.showFps && !fpsEl && document.body) {
      fpsEl = document.createElement('div');
      fpsEl.setAttribute('aria-hidden', 'true');
      fpsEl.style.cssText =
        'position:fixed;left:10px;bottom:10px;z-index:2147483647;pointer-events:none;' +
        'font:500 11px/1 "JetBrains Mono",ui-monospace,monospace;padding:5px 7px;border-radius:6px;' +
        'background:rgba(0,0,0,.55);color:#b6ff00;letter-spacing:.04em';
      fpsEl.textContent = '-- fps';
      document.body.appendChild(fpsEl);
      lastT = 0;
      frames = 0;
      rafId = requestAnimationFrame(fpsLoop);
    } else if (!prefs.showFps && fpsEl) {
      cancelAnimationFrame(rafId);
      fpsEl.remove();
      fpsEl = null;
    }
  }

  // ---------- mensajes del portal ----------
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.gameit !== 1 || e.source !== window.parent) return;
    parentOrigin = e.origin;
    if (d.type === 'init') adsHost = !!d.ads;
    if (d.type === 'init' || d.type === 'prefs') setPrefs(d.prefs);
    else if (d.type === 'ad-result' && reqs[d.id]) {
      reqs[d.id](d.value);
      delete reqs[d.id];
    }
    else if (d.type === 'pause') setPaused(true);
    else if (d.type === 'resume') setPaused(false);
  });

  function setPaused(v) {
    if (paused === v) return;
    paused = v;
    (v ? subs.pause : subs.resume).forEach(function (fn) { fn(); });
  }

  // otra pestaña/ventana cambió las preferencias (modo suelto)
  window.addEventListener('storage', function (e) {
    if (e.key === 'gameit:prefs:resolved' && !embedded) setPrefs(readLocal());
  });

  // ---------- actividad (para atenuar la barra del portal cuando no se usa) ----------
  var lastAct = 0;
  function activity() {
    var n = Date.now();
    if (n - lastAct > 400) {
      lastAct = n;
      post('activity');
    }
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, activity, { passive: true, capture: true });
  });

  /** Pedido al portal con respuesta (false si no hay portal o no contesta a tiempo). */
  function request(op, data, timeout) {
    return new Promise(function (resolve) {
      if (!embedded || !adsHost) return resolve(false);
      var id = ++reqId;
      reqs[id] = resolve;
      var msg = { op: op, id: id };
      if (data) for (var k in data) msg[k] = data[k];
      post('ad', msg);
      setTimeout(function () {
        if (reqs[id]) {
          reqs[id](false);
          delete reqs[id];
        }
      }, timeout);
    });
  }

  var DIRS = {
    arrows: { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' },
    wasd: { KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right' },
  };

  var api = {
    version: '1.0.0',
    embedded: embedded,
    /** Preferencias resueltas (tema, colores, volumen, movimiento, controles, idioma). */
    get prefs() { return prefs; },
    get paused() { return paused; },
    /** Suscribe a cambios de preferencias. Con `now = true` se llama también al instante. */
    onPrefs: function (fn, now) {
      subs.prefs.push(fn);
      if (now) fn(prefs);
      return function () { subs.prefs.splice(subs.prefs.indexOf(fn), 1); };
    },
    onPause: function (fn) { subs.pause.push(fn); },
    onResume: function (fn) { subs.resume.push(fn); },
    /** Progreso de carga 0..1 (opcional). */
    progress: function (p) { post('progress', { value: +p || 0 }); },
    /** El juego está listo: el portal retira la pantalla de carga. */
    ready: function () {
      if (readySent) return;
      readySent = true;
      post('ready');
    },
    /** Vuelve al menú principal. */
    exit: function () {
      if (embedded) post('exit');
      else location.href = '/';
    },
    /** Informa un error fatal de carga; el portal lo muestra y vuelve al menú. */
    error: function (message) { post('error', { message: String(message || '') }); },
    /**
     * Traduce un KeyboardEvent a 'up' | 'down' | 'left' | 'right' | null respetando la
     * preferencia de teclado (flechas, WASD o ambos).
     */
    dir: function (e) {
      var k = prefs.keys;
      return (k !== 'wasd' && DIRS.arrows[e.key]) || (k !== 'arrows' && DIRS.wasd[e.code]) || null;
    },
    /**
     * Avisa si se está jugando (true) o si el juego está en un menú, pausa o fin de partida
     * (false). Con false el portal puede mostrar un banner en una franja aparte, nunca encima.
     */
    gameplay: function (on) {
      on = !!on;
      if (playing === on) return;
      playing = on;
      post('ad', { op: 'gameplay', on: on });
    },
    gameplayStart: function () { api.gameplay(true); },
    gameplayStop: function () { api.gameplay(false); },
    /** Pausa natural (antes de una revancha o del siguiente nivel). Resuelve cuando se puede seguir. */
    commercialBreak: function (name) { return request('break', { name: String(name || 'next') }, 100000); },
    /** ¿Hay un anuncio con recompensa disponible? Mostrar la oferta solo si resuelve true. */
    rewardAvailable: function (name) { return request('reward?', { name: String(name || 'reward') }, 5000); },
    /** El jugador eligió ver el anuncio: resuelve true si lo vio y corresponde la recompensa. */
    showReward: function () { return request('reward!', null, 150000); },
    /** Elige entre textos { es, en } según el idioma de las preferencias. */
    t: function (obj) { return obj[prefs.lang] || obj.es || obj.en; },
  };

  window.GameIt = api;
  applyTheme();
  if (document.body) updateFps();
  else document.addEventListener('DOMContentLoaded', updateFps);
  post('hello', { version: api.version });
})();

</script>

<script type="module">
//#region game.it/public/games/voleyball/shared/physics.js
/**
* Voleyball — física 2D de los jugadores, compartida por el cliente y el servidor.
*
* Es la misma de Clashball (reproducción fiel del motor de HaxBall): paso fijo de 60 ticks por
* segundo, unidades en píxeles por tick, posición con la velocidad anterior y después
* velocidad = amortiguación · (velocidad + gravedad), y las mismas respuestas de colisión
* disco-disco, disco-plano, disco-segmento y disco-vértice. Acá mueve a los jugadores sobre la
* arena; la pelota vuela en 3D y la simula match.js.
*/
/** Banderas de colisión (cGroup / cMask), con los mismos valores que HaxBall. */
const F = {
	ball: 1,
	red: 2,
	blue: 4,
	redKO: 8,
	blueKO: 16,
	wall: 32,
	kick: 64,
	score: 128,
	all: 63
};
const disc = (o = {}) => ({
	x: 0,
	y: 0,
	vx: 0,
	vy: 0,
	gx: 0,
	gy: 0,
	r: 10,
	invMass: 1,
	damping: .99,
	bCoef: .5,
	cMask: F.all,
	cGroup: F.all,
	...o
});
function plane(nx, ny, dist, o = {}) {
	const l = Math.hypot(nx, ny);
	return {
		nx: nx / l,
		ny: ny / l,
		dist,
		bCoef: 1,
		cMask: F.all,
		cGroup: F.wall,
		...o
	};
}
/**
* Avanza un tick. `hits` (opcional) recibe los rebotes con [índiceA, índiceB | -1, velocidad]
* para sonidos, efectos y para saber quién tocó la pelota.
*/
function step(world, hits) {
	const D = world.discs;
	const n = D.length;
	for (let i = 0; i < n; i++) {
		const d = D[i];
		d.x += d.vx;
		d.y += d.vy;
		d.vx = d.damping * (d.vx + d.gx);
		d.vy = d.damping * (d.vy + d.gy);
	}
	const { planes, segments, vertices } = world;
	for (let i = 0; i < n; i++) {
		const a = D[i];
		const aMask = a.cMask;
		const aGroup = a.cGroup;
		for (let j = i + 1; j < n; j++) {
			const c = D[j];
			if (!(c.cMask & aGroup) || !(c.cGroup & aMask)) continue;
			let dx = a.x - c.x;
			let dy = a.y - c.y;
			const d2 = dx * dx + dy * dy;
			const R = c.r + a.r;
			if (d2 <= 0 || d2 > R * R) continue;
			const sum = a.invMass + c.invMass;
			if (sum === 0) continue;
			const d = Math.sqrt(d2);
			dx /= d;
			dy /= d;
			let f = a.invMass / sum;
			let o = R - d;
			const m = o * f;
			a.x += dx * m;
			a.y += dy * m;
			o -= m;
			c.x -= dx * o;
			c.y -= dy * o;
			let rv = dx * (a.vx - c.vx) + dy * (a.vy - c.vy);
			if (rv < 0) {
				const speed = -rv;
				rv *= a.bCoef * c.bCoef + 1;
				f *= rv;
				a.vx -= dx * f;
				a.vy -= dy * f;
				f = rv - f;
				c.vx += dx * f;
				c.vy += dy * f;
				if (hits) hits.push([
					i,
					j,
					speed
				]);
			}
		}
		if (a.invMass === 0) continue;
		const r = a.r;
		for (let k = 0; k < planes.length; k++) {
			const p = planes[k];
			if (!(p.cMask & aGroup) || !(p.cGroup & aMask)) continue;
			let l = p.dist - (p.nx * a.x + p.ny * a.y) + r;
			if (l <= 0) continue;
			a.x += p.nx * l;
			a.y += p.ny * l;
			l = a.vx * p.nx + a.vy * p.ny;
			if (l < 0) {
				if (hits) hits.push([
					i,
					-1,
					-l
				]);
				l *= a.bCoef * p.bCoef + 1;
				a.vx -= l * p.nx;
				a.vy -= l * p.ny;
			}
		}
		for (let k = 0; k < segments.length; k++) {
			const s = segments[k];
			if (!(s.cMask & aGroup) || !(s.cGroup & aMask)) continue;
			let nx;
			let ny;
			let dist;
			if (Number.isFinite(s.curveF)) {
				const vx = a.x - s.cx;
				const vy = a.y - s.cy;
				if ((s.n0x * vx + s.n0y * vy > 0 && s.n1x * vx + s.n1y * vy > 0) === s.curveF <= 0) continue;
				const len = Math.sqrt(vx * vx + vy * vy);
				if (len === 0) continue;
				dist = len - s.arcR;
				nx = vx / len;
				ny = vy / len;
			} else {
				const { v0, v1 } = s;
				const ex = v1.x - v0.x;
				const ey = v1.y - v0.y;
				const px = a.x - v1.x;

	join(code, name) {

		if (!net?.isHost) return;
		e.preventDefault();
		col.classList.add("drop");
	});
	col.addEventListener("dragleave", () => col.classList.remove("drop"));
	col.addEventListener("drop", (e) => {
		e.preventDefault();
		col.classList.remove("drop");
		const [id, bot] = (e.dataTransfer.getData("text/plain") || "").split("|");
		if (!id) return;
		const team = Number(col.dataset.team);
		if (bot && team === 0) net.send({
			t: "bot",
			rm: id
		});
		else net.send({
			t: "team",
			id,
			team
		});
	});
});
$("room-start").onclick = () => {
	unlock();
	play("ui");
	overlayWanted = false;
	net.send({ t: "start" });
};
$("room-shuffle").onclick = () => net.send({ t: "shuffle" });
$("room-stop").onclick = () => net.send({ t: "stop" });
$("room-back").onclick = () => closeRoomOverlay();
$("room-pause").onclick = () => net.send({
	t: "pause",
	on: !net.room?.paused
});
$("room-leave").onclick = () => {
	play("ui");
	leaveOnline(true);
};
$("room-code").onclick = async () => {
	if (await share("voleyball", net.room.code) === "copied") toast(t("copied"));
};
function addChat(msg) {
	msg.at = performance.now();
	S.chat.push(msg);
	if (S.chat.length > 80) S.chat.shift();
	renderChat();
}
function chatLine(m) {
	if (m.sys) return `<li class="msg sys">${esc(m.text)}</li>`;
	return `<li class="msg"><b class="t${m.team || 0}">${esc(m.name)}:</b> ${esc(m.text)}</li>`;
}
function renderChat() {
	const now = performance.now();
	const hud = S.chat.slice(-7);
	$("chat-log").innerHTML = hud.map((m) => chatLine(m).replace("<li class=\"msg", `<li class="msg${now - m.at > 9e3 ? " old" : ""}`)).join("");
	const rc = $("room-chat");
	rc.innerHTML = S.chat.slice(-60).map(chatLine).join("");
	rc.scrollTop = rc.scrollHeight;
}
setInterval(() => S.kind === "online" && renderChat(), 3e3);
function openChat() {
	if (S.kind !== "online" || !S.session) return;
	$("chat").classList.add("typing");
	$("chat-in").focus();
	setEnabled(false);
}
function closeChat() {
	$("chat").classList.remove("typing");
	$("chat-in").blur();
	$("chat-in").value = "";
	refreshChrome();
}
$("chat-form").onsubmit = (e) => {
	e.preventDefault();
	const v = $("chat-in").value.trim();
	if (v) net.send({
		t: "chat",
		m: v
	});
	closeChat();
};
$("chat-in").addEventListener("keydown", (e) => {
	if (e.key === "Escape") {
		e.preventDefault();
		e.stopPropagation();
		closeChat();
	}
});
$("chat-in").addEventListener("blur", () => setTimeout(() => document.activeElement !== $("chat-in") && $("chat").classList.remove("typing"), 50));
$("room-chat-form").onsubmit = (e) => {
	e.preventDefault();
	const v = $("room-chat-in").value.trim();
	if (v) net.send({
		t: "chat",
		m: v
	});
	$("room-chat-in").value = "";
};
$("btn-chat").onclick = () => openChat();
addEventListener("keydown", (e) => {
	if (document.activeElement?.tagName === "INPUT") {
		if (e.key === "Escape") document.activeElement.blur();
		return;
	}
	if (e.key === "Escape") {
		e.preventDefault();
		if (S.kind === "online" && S.session) return S.screen === "s-room" ? closeRoomOverlay() : openRoomOverlay();
		if (S.session && S.kind !== "online" && !S.ended) return pauseLocal(!S.session.paused);
		if (S.screen && S.screen !== "s-home" && S.screen !== "s-results" && S.screen !== "s-room") back();
		return;
	}
	if (S.kind === "online" && S.session && !S.screen && (e.key === "Enter" || e.code === "KeyT")) {
		e.preventDefault();
		return openChat();
	}
	if (e.code === "KeyP" && S.session && !S.ended) {
		if (S.kind === "online") net.isHost && net.send({
			t: "pause",
			on: !net.room?.paused
		});
		else pauseLocal(!S.session.paused);
	}
});
document.body.classList.toggle("embedded", !!G.embedded);
initTouch($("stick-zone"), $("stick"), $("knob"), $("hit-btn"));
addEventListener("pointerdown", () => unlock(), { once: true });
G.onPrefs(() => {
	applyTexts();
	refreshChrome();
}, true);
G.onPause(() => {
	suspend();
	if (S.session && S.kind !== "online" && !S.session.paused && !S.ended) pauseLocal(true);
});
G.onResume(() => resume());
document.addEventListener("visibilitychange", () => {
	if (document.hidden && S.session && S.kind !== "online" && !S.ended) pauseLocal(true);
});
/** ¿Había una partida online en esta pestaña? (recargar la página vuelve a la sala) */
function savedSession() {
	try {
		return !!sessionStorage.getItem("gameit:session:voleyball");
	} catch {
		return false;
	}
}
if (/[?&]debug\b/.test(location.search)) window.__voleyball = S;
startDemo();
requestAnimationFrame(frame);
const code = roomFromUrl();
if (code) {
	ensureNet();
	show("s-online");
	joinRoom(code);
} else if (savedSession() && ensureNet().resume()) show("s-online");
G.ready();
//#endregion

</script>
</body>
</html>
