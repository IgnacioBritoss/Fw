<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) vale 0 en iPhone y no
         se puede pintar debajo de la barra de estado ni respetar el notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de la barra del navegador en iOS/Android. Las pantallas de entrada lo
         cambian a oscuro mientras están abiertas (ver useThemeColor), para que la
         franja de arriba llegue hasta el borde del teléfono. -->
    <meta name="theme-color" content="#ffffff" />
    <title>Freewheel — Alquiler de autos entre particulares</title>
    <!-- El ícono de la pestaña: el mismo auto del logo, SIN el cuadrado de fondo.
         Va en el azul de la marca y no en blanco porque un auto blanco sobre
         transparente desaparece en una pestaña clara, que es donde más se mira. -->

  </head>

</html>
